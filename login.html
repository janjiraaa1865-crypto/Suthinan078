<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>เข้าสู่ระบบ | เที่ยวบ้านเรา</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .login-box {
      max-width: 420px;
      margin: 40px auto;
      background-color: #ffffff;
      border: 1px solid #b3e5fc;
      border-radius: 14px;
      padding: 30px;
      box-shadow: 0 4px 12px rgba(2, 119, 189, 0.1);
    }
    .login-box h1 {
      text-align: center;
      color: #01579b;
      margin-bottom: 5px;
      font-size: 1.8rem;
    }
    .login-subtitle {
      text-align: center;
      color: #546e7a;
      font-size: 0.9rem;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
      color: #102a43;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #90caf9;
      border-radius: 8px;
      font-size: 1rem;
      font-family: inherit;
    }
    .password-row {
      display: flex;
      gap: 8px;
    }
    .password-row input {
      flex: 1;
    }
    .toggle-btn {
      background-color: #0277bd;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 0 15px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 0;
    }
    .toggle-btn:hover {
      background-color: #01579b;
    }
    .submit-btn {
      width: 100%;
      background-color: #0277bd;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    .submit-btn:hover {
      background-color: #01579b;
    }
    .demo-account {
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid #e1f5fe;
      font-size: 0.85rem;
      color: #546e7a;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <p class="site-name">เที่ยวบ้านเรา</p>
    <nav aria-label="เมนูหลัก">
      <ul>
        <li><a href="index.html">หน้าแรก</a></li>
        <li><a href="places.html">ที่เที่ยว</a></li>
        <li><a href="food.html">อาหาร</a></li>
        <li><a href="plan.html">วางแผนเที่ยว</a></li>
        <li><a href="travel.html">ข้อมูลการเดินทาง</a></li>
        <li><a href="login.html">เข้าสู่ระบบ</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <div class="login-box">
      <h1>เข้าสู่ระบบ</h1>
      <p class="login-subtitle">ยินดีต้อนรับสู่เว็บไซต์เที่ยวบ้านเรา</p>

      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="username">ชื่อผู้ใช้</label>
          <input type="text" id="username" placeholder="กรอกชื่อผู้ใช้" required>
        </div>

        <div class="form-group">
          <label for="password">รหัสผ่าน</label>
          <div class="password-row">
            <input type="password" id="password" placeholder="กรอกรหัสผ่าน" required>
            <button type="button" class="toggle-btn" onclick="togglePassword()">แสดง</button>
          </div>
        </div>

        <div class="form-group">
          <label for="role">ประเภทผู้ใช้งาน</label>
          <select id="role">
            <option value="user">สมาชิก (User)</option>
            <option value="admin">ผู้ดูแลระบบ (Admin)</option>
          </select>
        </div>

        <button type="submit" class="submit-btn">เข้าสู่ระบบ</button>
      </form>

      <div class="demo-account">
        <strong>บัญชีทดลองสำหรับฝึกปฏิบัติ</strong><br>
        Admin: admin / admin123
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <p>จัดทำโดย สุธินันท์ ปานแดง 078 | ใบงานฝึกปฏิบัติวิชาการสร้างเว็บไซต์ทางธุรกิจ</p>
  </footer>

  <script>
    function togglePassword() {
      const passInput = document.getElementById("password");
      const btn = document.querySelector(".toggle-btn");
      if (passInput.type === "password") {
        passInput.type = "text";
        btn.textContent = "ซ่อน";
      } else {
        passInput.type = "password";
        btn.textContent = "แสดง";
      }
    }

    function handleLogin(event) {
      event.preventDefault();
      const user = document.getElementById("username").value;
      const pass = document.getElementById("password").value;
      if (user === "admin" && pass === "admin123") {
        alert("เข้าสู่ระบบสำเร็จ! ยินดีต้อนรับคุณ " + user);
        window.location.href = "index.html";
      } else {
        alert("เข้าสู่ระบบสำเร็จ! (โหมดสมาชิกทั่วไป)");
        window.location.href = "index.html";
      }
    }
  </script>
</body>
</html>
